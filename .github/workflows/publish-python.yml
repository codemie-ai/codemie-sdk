name: Publish Python SDK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to check or publish, for example python-v0.1.665'
        type: string
        required: true
      dry_run:
        description: 'Build and check only; do not publish'
        type: boolean
        default: true
      publish:
        description: 'Type "publish" to confirm a real release (also requires dry_run off)'
        type: string
        default: ''

permissions:
  contents: read

# One run per tag. A fixed group would keep only the newest pending run and cancel the ones in between.
concurrency:
  group: publish-python-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  check-version:
    name: Check release version
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.event.release.tag_name, 'python-v')
    uses: codemie-ai/ci-workflows/.github/workflows/reusable-release-version-check.yml@main
    with:
      ecosystem: pypi
      package-name: codemie-sdk-python
      tag: ${{ github.event.release.tag_name || inputs.tag }}
      manifest-path: sdk/codemie-python/pyproject.toml

  verify:
    name: Verify and build
    needs: [check-version]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.check-version.outputs.version }}
    defaults:
      run:
        working-directory: sdk/codemie-python
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pipx install poetry

      - name: Require main for a real publish
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == false && inputs.publish == 'publish'
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "A real publish must run from main, not $GITHUB_REF"; exit 1
          fi

      - name: Stamp the version
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: poetry version "$VERSION"

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint
        run: poetry run ruff check .

      - name: Unit tests
        run: poetry run pytest tests/

      - name: Build package
        run: poetry build

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: sdk/codemie-python/dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [check-version, verify]
    if: >-
      github.event_name == 'release' || (github.event_name == 'workflow_dispatch'
      && inputs.dry_run == false && inputs.publish == 'publish'
      && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
